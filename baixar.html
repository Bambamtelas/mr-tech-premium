<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Direto APK - MR TECH PREMIUM</title>
  <meta name="theme-color" content="#070a12">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .tv-wrapper {
      max-width: 580px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="tv-wrapper">
    <div class="tv-card-center" id="appDownloadCard">
      <!-- Marca -->
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 1.5rem;">
        <img src="assets/logo.jpg" alt="MR TECH" style="width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 0 10px var(--primary-glow);">
        <span style="font-family: var(--font-heading); font-weight: 800; font-size: 1.1rem; color: #fff; letter-spacing: 0.5px;">MR TECH PREMIUM</span>
      </div>

      <img id="dlAppIcon" class="app-logo-large" src="assets/logo.jpg" alt="App Icon">
      <h1 id="dlAppName" class="hero-title" style="font-size: 2.2rem; margin-bottom: 0.4rem;">Nome do App</h1>
      <div id="dlAppSpecs" style="color: #38bdf8; font-weight: 600; margin-bottom: 1.2rem; font-size: 0.95rem;">v1.0 • APK Direto</div>
      
      <p id="dlAppDesc" style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.8rem; line-height: 1.5;">
        Preparando o download do arquivo APK para seu dispositivo...
      </p>

      <!-- Contador de Download Automático -->
      <div id="dlCountdownBox" class="tv-countdown-box">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        Download iniciando em <strong id="dlCountdownNumber" style="color: #fff; font-size: 1.15rem; margin-left: 4px;">3</strong>s...
      </div>

      <!-- Botões de Ação -->
      <div style="display: flex; flex-direction: column; gap: 0.85rem; max-width: 380px; margin: 0 auto;">
        <a id="dlBtnAction" href="#" class="btn-main-download" download target="_blank">
          <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          BAIXAR APK AGORA
        </a>

        <a href="index.html" class="btn-admin" style="justify-content: center; padding: 12px;">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          Ver Todos os Aplicativos da Loja
        </a>
      </div>

      <div class="tv-tip" style="margin-top: 2rem; justify-content: center;">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Arquivo APK 100% verificado, seguro e livre de vírus.</span>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id') || urlParams.get('app') || urlParams.get('d');

      const apps = StoreDB.getApps();
      const app = (id ? StoreDB.getAppById(id) : null) || apps[0];

      if (!app) {
        window.location.href = 'index.html';
        return;
      }

      document.title = `Baixar ${app.name} - MR TECH PREMIUM`;
      document.getElementById('dlAppName').textContent = app.name;
      document.getElementById('dlAppIcon').src = app.icon || 'assets/logo.jpg';
      document.getElementById('dlAppSpecs').textContent = `${app.version || 'v1.0'} • ${app.size || 'APK'} • Download Direto`;
      document.getElementById('dlAppDesc').textContent = app.description || 'Download direto para Android.';

      const btnAction = document.getElementById('dlBtnAction');
      btnAction.href = app.apkUrl;
      btnAction.onclick = () => {
        StoreDB.incrementDownload(app.id);
      };

      // Contagem regressiva de 3s
      let count = 3;
      const countEl = document.getElementById('dlCountdownNumber');
      const timer = setInterval(() => {
        count--;
        if (countEl) countEl.textContent = count;
        if (count <= 0) {
          clearInterval(timer);
          document.getElementById('dlCountdownBox').innerHTML = '<span>⚡ Download iniciado automaticamente!</span>';
          StoreDB.incrementDownload(app.id);
          window.location.href = app.apkUrl;
        }
      }, 1000);
    });
  </script>
</body>
</html>
